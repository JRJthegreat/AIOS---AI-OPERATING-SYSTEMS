        - generic [ref=e165]:
          - paragraph [ref=e166]: Adhering to the Payment Card Industry Data Security Standard (PCI DSS) is required for organizations that store, process, or transmit cardholder data, or that can impact its security.
          - paragraph [ref=e167]: For many merchants, payment processors, SaaS companies, fintech platforms, and service providers, this means running regular security testing against the cardholder data environment (CDE). Two of the most common testing activities are vulnerability scanning and penetration testing.
          - paragraph [ref=e168]: They are related, but they are not the same.
          - paragraph [ref=e169]: A PCI DSS vulnerability scan helps identify known vulnerabilities, misconfigurations, and exposed services. A PCI DSS penetration test goes further by validating whether weaknesses can be exploited and whether an attacker could use them to compromise systems, move through the environment, or access cardholder data.
          - paragraph [ref=e170]: In this guide, we explain how PCI DSS penetration testing works, what Requirement 11.4 expects, how penetration testing differs from vulnerability scanning, how often testing is required, and what your report should include for compliance and audit readiness.
          - paragraph [ref=e171]:
            - text: We have also published a separate article on the
            - link "common vulnerabilities and findings we encounter in PCI DSS penetration testing assessments" [ref=e172] [cursor=pointer]:
              - /url: https://www.blazeinfosec.com/post/pci-dss-penetration-testing-findings/
            - text: ", based on a study of more than 660 pentests performed by Blaze in 2025."
          - heading "What is PCI penetration testing?" [level=2] [ref=e173]
          - paragraph [ref=e174]: PCI penetration testing is a security assessment focused on the systems, applications, networks, APIs, and segmentation controls that make up or support an organization’s cardholder data environment.
          - paragraph [ref=e175]: The goal is to test whether exploitable vulnerabilities or security weaknesses could affect the confidentiality, integrity, or availability of cardholder data.
          - paragraph [ref=e176]: "In PCI DSS v4.x, penetration testing is primarily addressed under Requirement 11.4: external and internal penetration testing is regularly performed, and exploitable vulnerabilities and security weaknesses are corrected."
          - paragraph [ref=e177]: "A PCI DSS penetration test usually includes:"
          - list [ref=e178]:
            - listitem [ref=e179]: Internal penetration testing
            - listitem [ref=e180]: External penetration testing
            - listitem [ref=e181]: Application-layer testing
            - listitem [ref=e182]: Network-layer testing
            - listitem [ref=e183]: Segmentation testing, if segmentation is used to reduce the PCI scope
            - listitem [ref=e184]: Retesting of exploitable findings after remediation
            - listitem [ref=e185]: Documentation suitable for audit or QSA review
          - paragraph [ref=e186]: "The main objectives of PCI DSS penetration testing are:"
          - heading "Identifying exploitable vulnerabilities" [level=3] [ref=e187]:
            - strong [ref=e189]: Identifying exploitable vulnerabilities
          - paragraph [ref=e190]: A PCI penetration test should identify weaknesses that could be exploited to compromise systems in or connected to the CDE. This includes exposed services, insecure applications, weak access controls, misconfigurations, authentication flaws, and network paths that should not exist.
          - heading "Validating security controls" [level=3] [ref=e191]:
            - strong [ref=e193]: Validating security controls
          - paragraph [ref=e194]: A penetration test helps verify whether security controls are working as intended. This includes network segmentation, firewall rules, authentication controls, access restrictions, monitoring coverage, and application-layer defenses.
          - heading "Supporting PCI DSS compliance" [level=3] [ref=e195]:
            - strong [ref=e197]: Supporting PCI DSS compliance
          - paragraph [ref=e198]: The test provides evidence that the organization has conducted internal and external penetration testing in accordance with a defined methodology and has corrected exploitable weaknesses.
          - heading "Prioritizing remediation" [level=3] [ref=e199]:
            - strong [ref=e201]: Prioritizing remediation
          - paragraph [ref=e202]: A PCI DSS penetration test should help teams focus on the issues that matter most. Findings should be ranked by risk, exploitability, business impact, and potential effect on cardholder data.
          - heading "Improving security over time" [level=3] [ref=e203]:
            - strong [ref=e205]: Improving security over time
          - paragraph [ref=e206]: PCI DSS penetration testing is not only an audit exercise. When done properly, it helps teams understand how their environment can be attacked and how to reduce real risk across applications, infrastructure, and payment flows.
          - heading "PCI penetration testing process" [level=2] [ref=e207]
          - heading "Scope definition" [level=3] [ref=e208]:
            - strong [ref=e210]: Scope definition
          - blockquote [ref=e211]
          - paragraph [ref=e212]: Every PCI DSS penetration test should start with a scope. Before testing begins, the organization and penetration testing provider need to identify the systems, applications, APIs, networks, cloud assets, endpoints, and third-party connections that store, process, transmit, or could impact the security of cardholder data.
          - paragraph [ref=e213]: This is where many PCI testing projects go wrong. If the scope is too narrow, the test may miss systems that can affect the CDE. For example, testing only a public-facing payment page may not be enough if internal APIs, administrative interfaces, cloud networks, or segmentation controls also support the payment environment.
          - paragraph [ref=e214]: The scope should include the CDE itself, the CDE perimeter, critical systems, and any connected systems that could create a path into the CDE. It should also define what is out of scope and why.
          - heading "External and internal penetration testing (networks and applications)" [level=3] [ref=e215]:
            - strong [ref=e217]: External and internal penetration testing (networks and applications)
          - paragraph [ref=e218]:
            - text: PCI DSS-focused penetration testing should evaluate external and internal attack surfaces to identify potential vulnerabilities and validate security controls, following the
            - link "pentesting guidance" [ref=e219] [cursor=pointer]:
              - /url: https://listings.pcisecuritystandards.org/documents/Penetration-Testing-Guidance-v1_1.pdf
            - text: outlined by the PCI Security Standards Council
          - paragraph [ref=e220]: External penetration testing targets systems and services at the perimeter that are accessible from the internet, such as public-facing networks, servers, web applications, and APIs. This type of testing helps uncover security risks that external attackers could exploit to gain unauthorized access to cardholder data or disrupt services.
          - paragraph [ref=e221]: Internal testing, as the name implies, focuses on the organization’s internal network, applications, and critical systems in the CDE scope. This testing aims to identify flaws that could be exploited by insiders and threat actors who have breached the external perimeter.
          - heading "Network segmentation testing" [level=3] [ref=e222]:
            - strong [ref=e224]: Network segmentation testing
          - paragraph [ref=e225]: Segmentation testing is an essential component of PCI DSS, specifically targeting organizations that implement network segmentation to isolate their CDEs from other networks. The primary goal of segmentation testing is to verify the effectiveness of the implemented controls and ensure they are robust enough to prevent unauthorized access to the CDE.
          - paragraph [ref=e226]:
            - text: Segmentation tests must be executed twice per year. The PCI Security Standards Council created comprehensive
            - link "guidance on segmentation" [ref=e227] [cursor=pointer]:
              - /url: https://listings.pcisecuritystandards.org/documents/Guidance-PCI-DSS-Scoping-and-Segmentation_v1.pdf
            - text: ", which is the authoritative reference on the topic."
          - heading "Documentation and reporting" [level=3] [ref=e228]:
            - strong [ref=e230]: Documentation and reporting
          - paragraph [ref=e231]:
            - text: Maintaining detailed documentation and reporting of the assessment is crucial for demonstrating PCI DSS compliance. The PCI penetration test report should include clear information about the test scope, penetration testing methodology, details about all identified vulnerabilities, remediation recommendations, and retest results. Organizations should retain these
            - link "reports" [ref=e232] [cursor=pointer]:
              - /url: https://www.blazeinfosec.com/post/penetration-testing-report/
            - text: as evidence of compliance during PCI DSS audits.
          - paragraph [ref=e233]: In our experience, some auditors may also request that the report include the exact date and time a vulnerability was identified and exploited, as well as the same information for when it was marked as fixed after retesting.
          - heading "Understanding PCI penetration testing requirements" [level=2] [ref=e234]
          - paragraph [ref=e235]: PCI DSS Requirement 11 focuses on regularly testing the security of systems and networks within the CDE environment for organizations that handle cardholder data.
          - paragraph [ref=e236]: For PCI DSS penetration testing, the most relevant section is Requirement 11.4.
          - paragraph [ref=e237]: A common source of confusion is the change in numbering between PCI DSS 3.2.1 and PCI DSS v4.x. In PCI DSS 3.2.1, penetration testing was covered under Requirement 11.3. In PCI DSS v4.x, penetration testing moved to Requirement 11.4.
          - paragraph [ref=e238]: This means older articles, reports, and audit notes may still refer to Requirement 11.3 when discussing penetration testing. For current PCI DSS v4.x assessments, the key penetration testing requirement is 11.4.
          - paragraph [ref=e239]: "For the purposes of pentesting, the following sub-items of Requirement 11 are important to be addressed:"
          - paragraph [ref=e240]:
            - strong [ref=e241]: PCI DSS Requirement 11.3
            - text: is the cornerstone of penetration testing within PCI DSS 3.2.1, ensuring organizations safeguard their CDEs through comprehensive and regular security assessments. The norm says that security testing must be performed based on recognized industry methodologies – it explicitly mentions
            - link "NIST SP 800-115" [ref=e242] [cursor=pointer]:
              - /url: https://www.nist.gov/privacy-framework/nist-sp-800-115
            - text: ", but others, such as OSSTMM, OWASP and PTES, also apply, per"
            - link "4.4 in Penetration Testing Guidance" [ref=e243] [cursor=pointer]:
              - /url: https://listings.pcisecuritystandards.org/documents/Penetration-Testing-Guidance-v1_1.pdf
            - text: .
          - paragraph [ref=e244]: "The requirement is divided into three primary components: addressing network penetration testing, internal penetration testing, and segmentation controls."
          - paragraph [ref=e245]:
            - text: Firstly,
            - strong [ref=e246]: Requirement 11.3.1
            - text: focuses on external network penetration testing, emphasizing that organizations must test their internet-facing servers and networks to identify vulnerabilities that could be exploited by external adversaries. By conducting an annual network penetration test, businesses can proactively identify security weaknesses and implement appropriate measures to protect sensitive cardholder data.
          - paragraph [ref=e247]:
            - text: Next,
            - strong [ref=e248]: Requirement 11.3.2
            - text: pertains to internal penetration testing, requiring organizations to evaluate their internal systems, networks, and applications for potential security gaps. Internal penetration testing plays a crucial role in uncovering risks that may not be visible from the outside but could be exploited by an insider or an attacker who has already gained access to the internal network. It needs to be done at least once per year.
          - paragraph [ref=e249]:
            - strong [ref=e250]: Requirement 11.3.3
            - text: addresses retesting and emphasizes the need for timely remediation.
          - paragraph [ref=e251]:
            - text: Finally,
            - strong [ref=e252]: Requirement 11.3.4
            - text: addresses the need to test segmentation controls if an organization uses network segmentation as a method to isolate its CDE from other networks. This requirement ensures that network isolation controls are functioning effectively and that there is no unauthorized access to the CDE.
          - paragraph [ref=e253]: "Other security-relevant requirements of item 11 are the following:"
          - paragraph [ref=e254]:
            - strong [ref=e255]: Requirement 11.1
            - text: intends to ensure the security of an organization’s wireless networks within or connected to the cardholder data environment. The main focus is on rogue access points, and sweeps must be conducted quarterly.
          - paragraph [ref=e256]:
            - strong [ref=e257]: Requirement 11.2
            - text: defines rules for running internal and external network vulnerability scans at least quarterly and after any significant change in the network. There are rules that require (or allow) the use of a PCI-approved scanning vendor to perform such scans.
          - paragraph [ref=e258]: Requirement 6 (Develop and maintain secure systems and applications) of PCI DSS is equally important for security testing, particularly requirements 6.5.1 through 6.5.6 (based on secure development practices) and 6.6 (testing).
          - paragraph [ref=e259]:
            - strong [ref=e260]: Requirement 6.6
            - text: explicitly mentions that companies seeking PCI DSS compliance must perform security evaluations of public-facing web applications (and APIs, per
            - link "4.2.1 Application Layer" [ref=e261] [cursor=pointer]:
              - /url: https://listings.pcisecuritystandards.org/documents/Penetration-Testing-Guidance-v1_1.pdf
            - text: ) using manual testing or automated tools for application vulnerability scanning
            - strong [ref=e262]: at least annually
            - text: and after any relevant changes.
          - paragraph [ref=e263]:
            - link "OWASP Top 10" [ref=e264] [cursor=pointer]:
              - /url: https://owasp.org/www-project-top-ten/
            - text: and
            - link "OWASP ASVS" [ref=e265] [cursor=pointer]:
              - /url: https://owasp.org/www-project-application-security-verification-standard/
            - text: are the most popular methodologies for application-layer testing and security of web applications/APIs, and they are, without a doubt, the most relevant penetration testing methodologies for this item.
          - paragraph [ref=e266]: An important note above is that the vulnerability scans in Requirement 11.2 are not the same as the assessments needed to address 6.6.
          - paragraph [ref=e267]:
            - strong [ref=e268]: In PCI DSS 4.0, the requirement for web application security testing has changed to Requirement 6.4 (Public-facing web applications are protected against attacks).
          - paragraph [ref=e269]: "We have created an infographic to visually illustrate these requirements:"
          - paragraph [ref=e270]:
            - img "PCI penetration testing requirements" [ref=e272]
          - heading "PCI penetration testing frequency" [level=3] [ref=e273]:
            - strong [ref=e275]: PCI penetration testing frequency
          - paragraph [ref=e276]:
            - text: PCI DSS penetration testing should generally be performed
            - strong [ref=e277]: at least once every 12 months
            - text: and after any significant infrastructure or application upgrade or change.
          - paragraph [ref=e278]: A significant change could include a new payment application, a major application release, a new payment API, a cloud migration, firewall or segmentation changes, new third-party connectivity, a major platform upgrade, or any change that affects how cardholder data is stored, processed, transmitted, or protected.
          - paragraph [ref=e279]: "The exact definition depends on the environment. A useful rule is this: if a change could affect the security of the CDE or create a new path to cardholder data, it should be reviewed for its impact on PCI DSS testing."
          - heading "Remediation and retesting process" [level=3] [ref=e280]:
            - strong [ref=e282]: Remediation and retesting process
          - paragraph [ref=e283]: After the penetration test, the organization should prioritize and remediate findings based on risk, exploitability, and potential impact on the CDE.
          - paragraph [ref=e284]: Fixing the issue is only part of the process. The fix should also be validated. Retesting provides evidence that exploitable vulnerabilities and security weaknesses were corrected.
          - paragraph [ref=e285]: This evidence is important for compliance review. A report that lists findings but does not indicate whether exploitable issues have been fixed may create problems during an audit or QSA assessment.
          - heading "What is the difference between a PCI penetration test and a regular pentest?" [level=2] [ref=e286]:
            - generic [ref=e287]: What is the difference between a PCI penetration test and a regular pentest?
          - paragraph [ref=e288]: A PCI penetration test and a regular penetration test use many of the same testing techniques, but they differ in scope, purpose, reporting, and compliance expectations.
          - paragraph [ref=e289]: A regular penetration test may focus on a single application, API, cloud environment, network, product, or business-critical system. The scope is usually defined by the organization’s security priorities.
          - paragraph [ref=e290]: A PCI penetration test focuses on the cardholder data environment and systems that can affect cardholder data security. It must address PCI DSS expectations for internal testing, external testing, segmentation testing where applicable, methodology, remediation, and evidence retention.
          - heading "Key differences between PCI DSS penetration testing and regular penetration testing" [level=3] [ref=e291]:
            - strong [ref=e293]: Key differences between PCI DSS penetration testing and regular penetration testing
          - table [ref=e294]:
            - rowgroup [ref=e295]:
              - row "Area PCI DSS penetration test Regular penetration test" [ref=e296]:
