              - row "Output Vulnerability scan report Exploitation evidence, impact analysis, remediation guidance, and retest evidence" [ref=e366]:
                - cell "Output" [ref=e367]
                - cell "Vulnerability scan report" [ref=e368]
                - cell "Exploitation evidence, impact analysis, remediation guidance, and retest evidence" [ref=e369]
              - row "Compliance role Required security testing activity Separate required security testing activity" [ref=e370]:
