          - paragraph [ref=e374]: Most organizations subject to PCI DSS need both activities. A passing ASV scan does not prove that a penetration test was performed, and a penetration test does not replace required vulnerability scans.
          - heading "Key differences between PCI DSS 4.x and PCI DSS 3.2.1" [level=2] [ref=e375]
          - paragraph [ref=e376]: "The core idea behind PCI penetration testing has not changed: organizations need to test their environments, identify exploitable weaknesses, fix them, and verify remediation."
          - paragraph [ref=e377]: However, PCI DSS v4.x changed how the requirements are organized and clarified several expectations.
          - paragraph [ref=e378]: The most important change is numbering. Penetration testing moved from Requirement 11.3 in PCI DSS 3.2.1 to Requirement 11.4 in PCI DSS v4.x.
          - paragraph [ref=e379]: "Other important changes and clarifications include:"
          - list [ref=e380]:
            - listitem [ref=e381]: More explicit expectations for a documented penetration testing methodology
            - listitem [ref=e382]: Clearer internal and external testing requirements
            - listitem [ref=e383]: Clearer segmentation testing expectations
            - listitem [ref=e384]: More emphasis on application-layer and network-layer testing
            - listitem [ref=e385]: Retention of penetration testing and remediation results for at least 12 months
            - listitem [ref=e386]: Explicit use of authenticated internal vulnerability scanning under Requirement 11.3.1.2
            - listitem [ref=e387]: Newer requirements around payment page change and tamper detection under Requirement 11.6
            - listitem [ref=e388]: More focus on roles, responsibilities, targeted risk analysis, and continuous security processes
          - paragraph [ref=e389]: For current assessments, organizations should work from PCI DSS v4.0.1 or the version in force at the time of assessment. References to PCI DSS 3.2.1 should be treated as historical unless an auditor is reviewing older evidence.
          - paragraph [ref=e390]:
            - text: For instance, it now states,
            - emphasis [ref=e391]: “Testing from inside the network (or ‘internal penetration testing’) means testing from both inside the CDE and into the CDE from trusted and untrusted internal networks”
            - text: and
            - emphasis [ref=e392]: “Testing from outside the network (or ‘external penetration testing’) means testing the exposed external perimeter of trusted networks, and critical systems connected to or accessible to public network infrastructures.”
            - text: ", to properly define what PCI means when it says internal and external pentesting and from which vantage point it must be executed."
          - paragraph [ref=e393]:
            - text: Another item worth mentioning is
            - emphasis [ref=e394]: “11.3.1.2 Internal vulnerability scans are performed via authenticated scanning.”
            - text: – before that, there was no explicit requirement for grey-box automated testing or for scans to be authenticated; now it ensures the vulnerability scanner covers a larger surface area.
          - paragraph [ref=e395]:
            - text: In our opinion, the most significant introduction in 4.0 was 11.6, Unauthorized changes on payment pages are detected and responded to. This item was introduced to prevent code tampering in e-commerce platforms and combat JavaScript-based skimming, known as
            - link "Magecart attacks," [ref=e396] [cursor=pointer]:
              - /url: https://www.imperva.com/learn/application-security/magecart/
            - text: such as the one that
            - link "impacted British Airways" [ref=e397] [cursor=pointer]:
              - /url: https://www.theregister.com/2020/10/16/british_airways_ico_fine_20m/
            - text: in 2020.
          - paragraph [ref=e398]:
            - img "Differences PCI DSS 4.0 and 3.2.1" [ref=e400]
          - heading "Common tools used in PCI penetration testing" [level=2] [ref=e401]
          - paragraph [ref=e402]: In PCI penetration testing, a wide range of tools is employed to assess the security of the CDE environment and identify potential vulnerabilities that attackers could exploit.
          - paragraph [ref=e403]: "These tools are crucial in evaluating various aspects of an organization’s security posture, including network configurations, web applications, wireless networks, and system vulnerabilities. The choice of tools may vary depending on the specific needs and goals of the penetration test, but some commonly used tools in a PCI penetration test include:"
          - list [ref=e404]:
            - listitem [ref=e405]:
              - strong [ref=e406]: Nmap
              - text: ": For network scanning and discovery of open ports and services, as well as segmentation checks."
            - listitem [ref=e407]:
              - strong [ref=e408]: Nessus
              - text: ": To automate the process of identifying known vulnerabilities in systems, networks, and applications. It can also be used for ASV scans, as it can perform PCI vulnerability scanning."
            - listitem [ref=e409]:
              - strong [ref=e410]: Metasploit
              - text: ": A comprehensive exploitation framework for developing and executing exploit code against identified vulnerabilities."
            - listitem [ref=e411]:
              - strong [ref=e412]: Burp Suite
              - text: ": A powerful web application security testing tool with features such as an intercepting proxy, web vulnerability scanning, and session manipulation."
            - listitem [ref=e413]:
              - strong [ref=e414]: Wireshark
              - text: ": A network protocol analyzer for capturing and analyzing network traffic, providing valuable insights into potential vulnerabilities and attack vectors. Particularly useful for verifying whether card data is traversing the network unencrypted."
            - listitem [ref=e415]:
              - strong [ref=e416]: Memory scraping tool
              - text: ": A regex-based RAM scraping tool can be useful in PCI security testing to identify credit card data temporarily stored in the memory of a CDE-located server once the pentester has compromised it."
          - paragraph [ref=e417]:
            - img "PCI pentest tools" [ref=e419]
          - paragraph [ref=e420]: The list above is non-exhaustive, and several other tools can be used depending on the assessment’s needs.
          - heading "What should a PCI penetration test report include?" [level=2] [ref=e421]:
            - generic [ref=e422]: What should a PCI penetration test report include?
          - paragraph [ref=e423]: "A PCI DSS penetration test report should help three audiences:"
          - list [ref=e424]:
            - listitem [ref=e425]: Technical teams that need to fix the issues
            - listitem [ref=e426]: Security leaders who need to understand risk
            - listitem [ref=e427]: Auditors or QSAs who need evidence that testing was performed properly
          - paragraph [ref=e428]: At a minimum, the report should include the scope, test dates, rules of engagement, methodology, internal and external testing coverage, application and network testing coverage, segmentation testing details where applicable, findings, evidence, impact, severity, remediation guidance, and retest status.
          - paragraph [ref=e429]: For PCI DSS, reporting should be specific enough to show that testing covered the CDE, critical systems, and segmentation controls where applicable.
          - heading "Engaging a qualified penetration testing company" [level=2] [ref=e430]
          - paragraph [ref=e431]: PCI DSS does not require the penetration tester to be a QSA or ASV. However, the tester must be qualified, and organizational independence must exist.
          - paragraph [ref=e432]: That means the test should not be performed by someone responsible for managing, developing, or maintaining the systems being tested.
          - paragraph [ref=e433]: When choosing a PCI penetration testing provider, look for experience in testing payment environments, familiarity with PCI DSS Requirement 11.4, application and network testing capability, segmentation testing experience, clear rules of engagement, evidence-based reporting, retesting support, and relevant credentials such as CREST, OSCP, OSWE, GPEN, GWAPT, or similar.
          - paragraph [ref=e434]: A good provider should help you scope the engagement properly, explain what evidence the report will contain, and avoid treating a generic vulnerability scan as a PCI DSS penetration test.
          - paragraph [ref=e435]: To help organizations navigate supplier selection, we have created a complete guide to choosing the right penetration testing company.
          - paragraph [ref=e436]:
            - link "Read our guide to choosing a penetration testing company." [ref=e437] [cursor=pointer]:
              - /url: https://www.blazeinfosec.com/post/choosing-a-penetration-testing-company/
          - heading "How can Blaze help with your PCI penetration testing requirements?" [level=2] [ref=e438]:
            - generic [ref=e439]: How can Blaze help with your PCI penetration testing requirements?
          - paragraph [ref=e440]:
            - text: At Blaze, we have our roots in providing penetration testing services for the financial sector, including banking and payments. We have performed dozens of
            - link "PCI pentesting" [ref=e441] [cursor=pointer]:
              - /url: https://www.blazeinfosec.com/solutions/pci-penetration-testing
            - text: assessments throughout the years.
          - paragraph [ref=e442]: Blaze can support PCI DSS internal penetration testing, external penetration testing, segmentation testing, web application and API penetration testing, network penetration testing, cloud environment testing, retesting, remediation validation, QSA-ready reporting, and CREST-accredited penetration testing engagements.
          - paragraph [ref=e443]:
            - text: If you’re ready to invest in your business’s security and compliance and are looking for a pentesting provider with relevant experience conducting PCI DSS assessments, we invite you to contact
            - link "our experts" [ref=e444] [cursor=pointer]:
              - /url: https://www.blazeinfosec.com/contact-us-form/
            - text: to discuss how we can help you achieve your security objectives.
          - heading "Conclusion" [level=2] [ref=e445]
          - paragraph [ref=e446]: PCI DSS penetration testing is a core part of protecting cardholder data and demonstrating compliance.
          - paragraph [ref=e447]: Under PCI DSS v4.x, organizations need to pay close attention to Requirement 11.4, which covers internal and external penetration testing, methodology, remediation, retesting, segmentation testing, and evidence retention.
          - paragraph [ref=e448]: The most common mistake is treating a vulnerability scan, ASV scan, or generic pentest as a complete PCI DSS penetration test. These activities overlap, but they do not serve the same purpose.
          - paragraph [ref=e449]: A strong PCI DSS penetration test should be properly scoped around the cardholder data environment, performed by qualified and independent testers, include application-layer and network-layer testing, validate segmentation where applicable, and provide clear evidence that exploitable weaknesses were corrected.
          - paragraph [ref=e450]: For merchants, service providers, SaaS companies, fintech platforms, and any organization handling payment data, PCI penetration testing should be treated as both a compliance requirement and a practical way to reduce payment security risk.
          - heading "FAQ" [level=2] [ref=e451]
        - generic [ref=e453]:
          - generic [ref=e454]:
            - heading "Does PCI require penetration testing?" [level=3] [ref=e455]:
              - strong [ref=e457]: Does PCI require penetration testing?
            - paragraph [ref=e459]: Yes, PCI requires penetration testing per Requirements 11.3 and 6.6 in PCI 3.2.1, and per Requirements 11.4 and 6.4 in PCI 4.0.
          - generic [ref=e460]:
            - heading "How often does PCI require penetration testing?" [level=3] [ref=e461]:
              - strong [ref=e463]: How often does PCI require penetration testing?
            - paragraph [ref=e465]: PCI pentesting is mandatory once a year or whenever there is a major change to networks, servers or systems.
          - generic [ref=e466]:
            - heading "When does PCI DSS 4.0 go into effect?" [level=3] [ref=e467]:
              - strong [ref=e469]: When does PCI DSS 4.0 go into effect?
            - paragraph [ref=e471]: PCI DSS 4.0 went into effect on March 31, 2024, and organizations had until March 31, 2025, to phase in new requirements.
          - generic [ref=e472]:
            - heading "What PCI DSS requirement covers penetration testing?" [level=3] [ref=e473]
            - paragraph [ref=e475]: In PCI DSS v4.x, penetration testing is covered under Requirement 11.4. In PCI DSS 3.2.1, penetration testing was covered under Requirement 11.3. This numbering change is important because older reports, guides, and audit notes may still refer to Requirement 11.3 when discussing penetration testing.
          - generic [ref=e476]:
            - heading "Is a PCI vulnerability scan the same as a PCI penetration test?" [level=3] [ref=e477]
            - paragraph [ref=e479]: No. A vulnerability scan identifies known vulnerabilities and misconfigurations. A penetration test validates whether weaknesses can be exploited and whether an attacker could use them to compromise systems or access cardholder data. PCI DSS treats vulnerability scanning and penetration testing as separate security testing activities.
          - generic [ref=e480]:
            - heading "Is an ASV scan enough for PCI DSS penetration testing?" [level=3] [ref=e481]
            - paragraph [ref=e483]: No. An ASV scan is an external vulnerability scan performed by a PCI SSC-approved scanning vendor. It does not replace the need for penetration testing under Requirement 11.4 where penetration testing applies.
          - generic [ref=e484]:
            - heading "Who can perform a PCI DSS penetration test?" [level=3] [ref=e485]
            - paragraph [ref=e487]: A PCI DSS penetration test can be performed by a qualified internal resource or a qualified external third party, provided organizational independence exists. The tester does not need to be a QSA or ASV, but they should have relevant penetration testing skills, experience, and methodology.
          - generic [ref=e488]:
            - heading "What changed from PCI DSS 3.2.1 to PCI DSS v4.x for penetration testing?" [level=3] [ref=e489]
            - paragraph [ref=e491]: The core requirement to perform penetration testing remains, but the numbering changed from Requirement 11.3 in PCI DSS 3.2.1 to Requirement 11.4 in PCI DSS v4.x. PCI DSS v4.x also provides clearer expectations for methodology, internal and external testing, segmentation validation, risk-based remediation, evidence retention, and payment page security.
