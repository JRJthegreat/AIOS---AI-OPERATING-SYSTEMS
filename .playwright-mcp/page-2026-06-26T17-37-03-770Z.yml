                - cell "Usually not required unless included in scope" [ref=e326]
              - row "Methodology Must be defined, documented, and aligned with accepted approaches Methodology may vary by provider and objective" [ref=e327]:
                - cell "Methodology" [ref=e328]
                - cell "Must be defined, documented, and aligned with accepted approaches" [ref=e329]
                - cell "Methodology may vary by provider and objective" [ref=e330]
          - paragraph [ref=e331]: Both types of testing are valuable. The key is to make sure the PCI DSS penetration test is scoped and reported in a way that satisfies Requirement 11.4, rather than treating a generic pentest report as automatically PCI-ready.
          - heading "PCI penetration testing vs PCI vulnerability scanning" [level=2] [ref=e332]:
            - generic [ref=e333]: PCI penetration testing vs PCI vulnerability scanning
          - paragraph [ref=e334]: A PCI vulnerability scan is not the same as a PCI penetration test.
          - paragraph [ref=e335]: Vulnerability scanning is usually broader and more automated. It identifies known vulnerabilities, missing patches, weak configurations, exposed services, and other security issues.
          - paragraph [ref=e336]: Penetration testing is more manual and adversarial. It attempts to validate exploitability, link chain weaknesses, and determine what an attacker could actually achieve.
