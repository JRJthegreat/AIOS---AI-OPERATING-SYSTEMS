                - text: Oakland, CA
                - paragraph [ref=e99]:
                  - text: We're seeking to contract a
                  - strong [ref=e100]: Psychologist, PsyD or Psychiatrist
                  - text: to perform Compensation & Pension Exams (C&P) for our military Veterans at various sites through the USA.
                - list [ref=e101]:
                  - listitem [ref=e102]: "Length: 6-12 months (option to extend)"
                  - listitem [ref=e103]: "Start Date: ASAP quick credentialing to train/onboard"
                  - listitem [ref=e104]: "Hours: FT, in-person preferred"
                  - listitem [ref=e105]: "Location: Oakland, CA"
                  - listitem [ref=e106]: "Pay: $72-$77/hour **Negotiable with experience**"
                - paragraph [ref=e107]
                - paragraph [ref=e108]:
                  - strong [ref=e109]: "Contract Description/Overview:"
                - paragraph [ref=e110]: Your services support the Veterans Benefits Administration Medical Disabilities Examinations program. Veterans are scheduled for appointments at contracted facilities for compensation and pension exams and embeds practitioners in facilities as needs warrant. Dedicated facilities are in areas where there is a large Veteran population with the potential for high volume.
                - paragraph [ref=e111]
                - list [ref=e112]:
                  - listitem [ref=e113]:
                    - text: The compensation and pension exam helps the VA answer questions about Veterans’ current health.
                    - strong [ref=e114]:
                      - emphasis [ref=e115]: The practitioners will not decide the percent of disability or rating, develop treatment plans, or prescribe medication.
                  - listitem [ref=e116]: Completed documentation is sent to the VA for final determination on all disability claims.
                  - listitem [ref=e117]: Prior to the exam, the practitioner reviews a Veteran’s medical or mental health history, using electronic bookmarks that highlight the portions applicable to the Veteran’s claimed condition.
                  - listitem [ref=e118]: The practitioner is guided through a web-based examination form in LHI’s Provider Portal to capture the Veteran’s responses during the exam.
                  - listitem [ref=e119]: Electronic exam documentation is known as a Disability Benefits Questionnaire (DBQ) and must be submitted promptly within 48 hours of each appointment.
                  - listitem [ref=e120]: The number of DBQs completed per exam will vary based on the Veteran’s claimed conditions.
                  - listitem [ref=e121]: Administrative time is provided to complete exam documentation and ensure timely submission.
                  - listitem [ref=e122]: The documentation is reviewed by a team of medical professionals to ensure contract compliance and guarantee the verbiage aligns with customer requirements.
                  - listitem [ref=e123]: Requests for changes or corrections to exam documentation must be submitted within 48 hours of the appointment.
                  - listitem [ref=e124]: Review pertinent medical history documentation and provide one-time, non-treatment compensation and pension exams for Veterans.
                  - listitem [ref=e125]: The Practitioner will capture responses during the exam through a web-based examination form; all documentation will be completed electronically.
                  - listitem [ref=e126]: Completed exams are sent to the U.S. Department of Veterans Affairs for disability award determinations.
                  - listitem [ref=e127]: Behavior Health exams are scheduled in 90+ minutes for a comprehensive exam for assessing PTSD, depression, anxiety and eating disorders.
                - paragraph [ref=e128]:
                  - strong [ref=e129]: •• Exam submission must be completed online, but no typing is necessary while the Veteran is present; time is provided throughout the day for dictation to ensure the flow of the patient interview is not disrupted.
                - paragraph [ref=e130]
                - paragraph [ref=e131]
                - paragraph [ref=e132]:
                  - strong [ref=e133]: Education/Qualifications
                - paragraph [ref=e134]: Qualified candidates must be a PhD or PsyD, with a major in Psychology, who graduated from a doctorate or post-doctorate APA accredited program or a BC/BE MD. Qualified candidates must be actively licensed and able to work independently and as part of a team, have good interpersonal skills and a willingness to be flexible and adapt to changing situations. Candidates must possess basic computer skills.
                - paragraph [ref=e135]: "*Compensation exam or VA experience is preferred, but not required. Module Training is provided."
